<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>加班确认</title>
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        color: hsl(222 47% 11%);
        background: hsl(0 0% 98%);
      }

      .overtime-bootstrap-backdrop {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 1rem;
        background: hsl(222 47% 11% / 0.5);
      }

      .overtime-bootstrap-card {
        width: min(92vw, 28.75rem);
        padding: 1.5rem;
        border: 1px solid hsl(214 20% 90%);
        border-radius: 0.5rem;
        background: hsl(0 0% 99%);
        box-shadow: 0 10px 24px hsl(222 47% 11% / 0.14);
      }

      .overtime-bootstrap-title {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin: 0;
        font-size: 1.125rem;
        font-weight: 600;
      }

      .overtime-bootstrap-spinner {
        width: 1.25rem;
        height: 1.25rem;
        border: 2px solid hsl(217 91% 60% / 0.22);
        border-top-color: hsl(217 91% 60%);
        border-radius: 999px;
        animation: overtime-bootstrap-spin 0.8s linear infinite;
      }

      .overtime-bootstrap-description {
        margin: 0.75rem 0 0 2rem;
        color: hsl(220 9% 46%);
        font-size: 0.875rem;
      }

      @keyframes overtime-bootstrap-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      window.csrfToken = '{{csrfToken}}';
    </script>
  </head>
  <body>
    <div id="root">
      <div
        class="overtime-bootstrap-backdrop"
        data-overtime-confirmation-bootstrap
        role="status"
        aria-live="polite"
      >
        <section class="overtime-bootstrap-card">
          <p class="overtime-bootstrap-title">
            <span class="overtime-bootstrap-spinner" aria-hidden="true"></span>
            正在读取加班记录
          </p>
          <p class="overtime-bootstrap-description">请稍候</p>
        </section>
      </div>
    </div>
  </body>
</html>
